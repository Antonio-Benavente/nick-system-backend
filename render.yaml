services:
  - type: web
    name: nick-system-backend
    runtime: node
    region: oregon
    plan: free
    branch: main
    buildCommand: corepack enable && corepack prepare pnpm@11.22.0 --activate && pnpm install --frozen-lockfile
    startCommand: pnpm start
    healthCheckPath: /ready
    envVars:
      - key: NODE_VERSION
        value: 24
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: TRUST_PROXY
        value: 1
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: TICKET_CODIGO_SECRET
        generateValue: true
      - key: CLAVES_ENCRYPTION_KEY
        sync: false
      - key: JWT_EXPIRES_IN
        value: 1d
      - key: JWT_EXPIRES_IN_APP_TECNICOS
        value: 365d
      - key: EXPO_ACCESS_TOKEN
        sync: false
      - key: APP_TECNICOS_VERSION_MINIMA
        value: 1.0.0
      - key: APP_TECNICOS_URL_DESCARGA
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        value: Nick System <soporte@nicksystem.com>
      - key: FRONTEND_URL
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: APP_TIMEZONE
        value: America/Lima
      - key: LOG_LEVEL
        value: info
      - key: SENTRY_DSN
        sync: false
      - key: SENTRY_TRACES_SAMPLE_RATE
        value: 0.1
      - key: FF_INCOMING_EVENTS
        value: observe
      - key: FF_ZOD_VALIDATION
        value: observe
      - key: FF_IDEMPOTENCY
        value: "off"
      - key: FF_PUSH
        value: "off"
      - key: EVIDENCIAS_MAX_MB
        value: 10
      - key: EVIDENCIAS_HOSTS
        value: res.cloudinary.com
      - key: RESEND_WEBHOOK_SECRET
        sync: false
      - key: WHATSAPP_TOKEN
        sync: false
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
      - key: WHATSAPP_VERIFY_TOKEN
        sync: false
      - key: WHATSAPP_APP_SECRET
        sync: false
      - key: WHATSAPP_GRAPH_VERSION
        value: v26.0
      - key: WHATSAPP_CONVERSACION_MINUTOS
        value: 30
      - key: WHATSAPP_MENSAJES_DIAS
        value: 7
      - key: WHATSAPP_INTENTOS_MAXIMOS
        value: 2
      - key: WHATSAPP_CONSULTA_TICKET_DIAS
        value: 90
      - key: WHATSAPP_PREFIJO_PAIS
        value: 51
      - key: TICKET_EMPRESA_CORREO
        value: G
      - key: TICKET_EMPRESA_WHATSAPP
        value: WhatsApp
      - key: TICKET_NOTIFICACION_EMAIL
        sync: false
      - key: TICKET_URGENCIA_TELEFONO
        sync: false
      - key: TICKET_URGENCIA_EMAIL
        sync: false
      - key: WARMUP_MINUTOS
        value: 10
      - key: WARMUP_HORARIO
        value: 08:00-22:00