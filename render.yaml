services:
  - type: web
    name: nick-system-backend
    runtime: node
    region: oregon
    plan: free
    branch: main
    buildCommand: npm i -g pnpm@11.22.0 && pnpm install --frozen-lockfile
    startCommand: pnpm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: TRUST_PROXY
        value: 1
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 1d
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        value: Nick System <soporte@nicksystem.com>
      - key: FRONTEND_URL
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: RESEND_WEBHOOK_SECRET
        sync: false
      - key: WHATSAPP_TOKEN
        sync: false
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
      - key: WHATSAPP_VERIFY_TOKEN
        sync: false
      - key: WHATSAPP_APP_SECRET
        sync: false
      - key: WHATSAPP_GRAPH_VERSION
        value: v25.0
      - key: WHATSAPP_CONVERSACION_MINUTOS
        value: 30
      - key: TICKET_EMPRESA_CORREO
        value: G
      - key: TICKET_EMPRESA_WHATSAPP
        value: WhatsApp