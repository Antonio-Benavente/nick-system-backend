services:
  - type: web
    name: nick-system-backend
    runtime: node
    region: oregon
    plan: free
    branch: main
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 1d
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        value: Nick System <pruebas@nicksystem.com>
      - key: FRONTEND_URL
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false